name: V3 inventory-scoped observed accumulation
on:
  workflow_dispatch:
    inputs:
      max_days:
        description: Latest market-start days to assess; 0 means every available complete past day
        type: number
        default: 0
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pendulumflow-v3-observed-production
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      inventory_tag: ${{ steps.plan.outputs.inventory_tag }}
      inventory_sha256: ${{ steps.plan.outputs.inventory_sha256 }}
      inventory_generation: ${{ steps.plan.outputs.inventory_generation }}
      mapping_batches: ${{ steps.plan.outputs.mapping_batches }}
      data_batches: ${{ steps.plan.outputs.data_batches }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - id: plan
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: python -m pflow.production plan
  mapping:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.mapping_batches) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          INVENTORY_TAG: ${{ needs.plan.outputs.inventory_tag }}
          INVENTORY_SHA: ${{ needs.plan.outputs.inventory_sha256 }}
          WORK_BATCH: ${{ toJSON(matrix.batch.items) }}
        run: python -m pflow.production mapping-batch --inventory-tag "$INVENTORY_TAG" --inventory-sha "$INVENTORY_SHA" --work "$WORK_BATCH"
  catalog:
    needs: [plan, mapping]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      catalog_tag: ${{ steps.catalog.outputs.catalog_tag }}
      catalog_sha256: ${{ steps.catalog.outputs.catalog_sha256 }}
      catalog_generation: ${{ steps.catalog.outputs.catalog_generation }}
      day_batches: ${{ steps.catalog.outputs.day_batches }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - id: catalog
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          INVENTORY_TAG: ${{ needs.plan.outputs.inventory_tag }}
          INVENTORY_SHA: ${{ needs.plan.outputs.inventory_sha256 }}
          MAX_DAYS: ${{ inputs.max_days || 0 }}
        run: python -m pflow.production catalog --inventory-tag "$INVENTORY_TAG" --inventory-sha "$INVENTORY_SHA" --max-days "$MAX_DAYS"
  data:
    needs: [plan, catalog]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.data_batches) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          INVENTORY_TAG: ${{ needs.plan.outputs.inventory_tag }}
          INVENTORY_SHA: ${{ needs.plan.outputs.inventory_sha256 }}
          CATALOG_TAG: ${{ needs.catalog.outputs.catalog_tag }}
          CATALOG_SHA: ${{ needs.catalog.outputs.catalog_sha256 }}
          WORK_BATCH: ${{ toJSON(matrix.batch.items) }}
        run: python -m pflow.production data-batch --inventory-tag "$INVENTORY_TAG" --inventory-sha "$INVENTORY_SHA" --catalog-tag "$CATALOG_TAG" --catalog-sha "$CATALOG_SHA" --work "$WORK_BATCH"
  index:
    needs: [plan, catalog, data]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      data_index_tag: ${{ steps.index.outputs.data_index_tag }}
      data_index_sha256: ${{ steps.index.outputs.data_index_sha256 }}
      data_index_generation: ${{ steps.index.outputs.data_index_generation }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - id: index
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          INVENTORY_TAG: ${{ needs.plan.outputs.inventory_tag }}
          INVENTORY_SHA: ${{ needs.plan.outputs.inventory_sha256 }}
          CATALOG_TAG: ${{ needs.catalog.outputs.catalog_tag }}
          CATALOG_SHA: ${{ needs.catalog.outputs.catalog_sha256 }}
        run: python -m pflow.production index --inventory-tag "$INVENTORY_TAG" --inventory-sha "$INVENTORY_SHA" --catalog-tag "$CATALOG_TAG" --catalog-sha "$CATALOG_SHA"
  certify:
    needs: [catalog, index]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: ${{ fromJSON(needs.catalog.outputs.day_batches) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          CATALOG_TAG: ${{ needs.catalog.outputs.catalog_tag }}
          CATALOG_SHA: ${{ needs.catalog.outputs.catalog_sha256 }}
          INDEX_TAG: ${{ needs.index.outputs.data_index_tag }}
          INDEX_SHA: ${{ needs.index.outputs.data_index_sha256 }}
          MARKET_DAYS: ${{ toJSON(matrix.batch.days) }}
        run: python -m pflow.production certify-batch --catalog-tag "$CATALOG_TAG" --catalog-sha "$CATALOG_SHA" --index-tag "$INDEX_TAG" --index-sha "$INDEX_SHA" --days "$MARKET_DAYS"
  window:
    needs: [catalog, index, certify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      window_tag: ${{ steps.window.outputs.window_tag }}
      handoff_sha256: ${{ steps.window.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - id: window
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          CATALOG_TAG: ${{ needs.catalog.outputs.catalog_tag }}
          CATALOG_SHA: ${{ needs.catalog.outputs.catalog_sha256 }}
          INDEX_TAG: ${{ needs.index.outputs.data_index_tag }}
          INDEX_SHA: ${{ needs.index.outputs.data_index_sha256 }}
        run: python -m pflow.production window --catalog-tag "$CATALOG_TAG" --catalog-sha "$CATALOG_SHA" --index-tag "$INDEX_TAG" --index-sha "$INDEX_SHA"
  verify:
    needs: window
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          WINDOW_TAG: ${{ needs.window.outputs.window_tag }}
          HANDOFF_SHA: ${{ needs.window.outputs.handoff_sha256 }}
        run: python -m pflow.production_consumer --tag "$WINDOW_TAG" --sha256 "$HANDOFF_SHA"
