name: Catalog pagination correction and durable inventory inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: python -m pflow.catalog_inspect
  series:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stream: [series-complete-ascending, series-complete-descending]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          CATALOG_STREAM: ${{ matrix.stream }}
        run: python -m pflow.catalog_enumerate "$CATALOG_STREAM"
