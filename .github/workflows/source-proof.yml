name: Native V3 bounded source proof
on:
  workflow_dispatch:
    inputs:
      prove_recovery:
        description: Inject one failure after durable sealing; rerun failed jobs to prove reuse
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: native-v3-source-proof
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      hours: ${{ steps.plan.outputs.hours }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - id: plan
        env:
          PYTHONPATH: src
        run: python -m pflow.probe plan
  probe:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        hour: ${{ fromJSON(needs.plan.outputs.hours) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          PROBE_HOUR: ${{ matrix.hour }}
        run: python -m pflow.probe probe --hour "$PROBE_HOUR"
      - name: Bounded crash-after-checkpoint recovery proof
        if: ${{ inputs.prove_recovery && github.run_attempt == 1 && matrix.hour == fromJSON(needs.plan.outputs.hours)[0] }}
        run: |
          echo "Intentional exit after sealed checkpoint; rerun failed jobs must reuse it."
          exit 86
