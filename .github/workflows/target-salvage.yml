name: Target-first retained V3 salvage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pendulumflow-target-first-salvage
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      target_catalog_tag: ${{ steps.catalog.outputs.target_catalog_tag }}
      target_catalog_sha256: ${{ steps.catalog.outputs.target_catalog_sha256 }}
      days: ${{ steps.catalog.outputs.days }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - id: catalog
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: python -m pflow.target_salvage catalog
  certify:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        day: ${{ fromJSON(needs.catalog.outputs.days) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ needs.catalog.outputs.target_catalog_tag }}
          TARGET_SHA: ${{ needs.catalog.outputs.target_catalog_sha256 }}
          TARGET_DAY: ${{ matrix.day }}
        run: python -m pflow.target_salvage certify --target-tag "$TARGET_TAG" --target-sha "$TARGET_SHA" --day "$TARGET_DAY"
  window:
    needs: [catalog, certify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      window_tag: ${{ steps.window.outputs.window_tag }}
      handoff_sha256: ${{ steps.window.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - id: window
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ needs.catalog.outputs.target_catalog_tag }}
          TARGET_SHA: ${{ needs.catalog.outputs.target_catalog_sha256 }}
        run: python -m pflow.target_salvage window --target-tag "$TARGET_TAG" --target-sha "$TARGET_SHA"
  verify:
    needs: window
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          WINDOW_TAG: ${{ needs.window.outputs.window_tag }}
          HANDOFF_SHA: ${{ needs.window.outputs.handoff_sha256 }}
        run: python -m pflow.target_salvage verify --tag "$WINDOW_TAG" --sha256 "$HANDOFF_SHA"
